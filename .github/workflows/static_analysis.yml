name: Static Analysis

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  phpstan:
    runs-on: ubuntu-24.04
    name: PHPStan (Larastan)

    steps:
      - name: Checkout DAM
        uses: actions/checkout@v5
        with:
          path: dam-package

      - name: Resolve latest UnoPim release
        id: unopim
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/unopim/unopim/releases/latest --jq .tag_name)
          test -n "$tag"
          echo "Testing against UnoPim $tag"
          echo "ref=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout UnoPim
        uses: actions/checkout@v5
        with:
          repository: unopim/unopim
          ref: ${{ steps.unopim.outputs.ref }}
          path: unopim

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, fileinfo, gd, intl, mbstring, openssl, pdo, pdo_mysql, tokenizer, zip
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: none

      - name: Symlink DAM into UnoPim packages
        run: |
          mkdir -p unopim/packages/Webkul/DAM
          cp -r dam-package/src unopim/packages/Webkul/DAM/src
          cp dam-package/composer.json unopim/packages/Webkul/DAM/composer.json
          cp dam-package/phpstan.neon.dist unopim/packages/Webkul/DAM/phpstan.neon.dist
          if [ -d dam-package/publishable ]; then
            cp -r dam-package/publishable unopim/packages/Webkul/DAM/publishable
          fi

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: |
            unopim/vendor
            ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-dam-${{ hashFiles('unopim/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-dam-

      - name: Install base dependencies
        working-directory: unopim
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - name: Register DAM as a path repository and require it
        working-directory: unopim
        run: |
          composer config repositories.dam '{"type":"path","url":"packages/Webkul/DAM","options":{"symlink":true}}' --json
          composer require unopim/dam:"*@dev" --no-interaction --no-progress --prefer-dist

      - name: Run PHPStan
        working-directory: unopim
        run: vendor/bin/phpstan analyse -c packages/Webkul/DAM/phpstan.neon.dist packages/Webkul/DAM/src --memory-limit=2G --no-progress

  rector:
    runs-on: ubuntu-24.04
    name: Rector (dry-run, advisory)

    steps:
      - name: Checkout DAM
        uses: actions/checkout@v5
        with:
          path: dam-package

      - name: Resolve latest UnoPim release
        id: unopim
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/unopim/unopim/releases/latest --jq .tag_name)
          test -n "$tag"
          echo "Testing against UnoPim $tag"
          echo "ref=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout UnoPim
        uses: actions/checkout@v5
        with:
          repository: unopim/unopim
          ref: ${{ steps.unopim.outputs.ref }}
          path: unopim

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, fileinfo, gd, intl, mbstring, openssl, pdo, pdo_mysql, tokenizer, zip
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: none

      - name: Symlink DAM into UnoPim packages
        run: |
          mkdir -p unopim/packages/Webkul/DAM
          cp -r dam-package/src unopim/packages/Webkul/DAM/src
          cp dam-package/composer.json unopim/packages/Webkul/DAM/composer.json
          cp dam-package/phpstan.neon.dist unopim/packages/Webkul/DAM/phpstan.neon.dist
          if [ -d dam-package/publishable ]; then
            cp -r dam-package/publishable unopim/packages/Webkul/DAM/publishable
          fi

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: |
            unopim/vendor
            ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-dam-${{ hashFiles('unopim/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-dam-

      - name: Install base dependencies
        working-directory: unopim
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - name: Register DAM as a path repository and require it
        working-directory: unopim
        run: |
          composer config repositories.dam '{"type":"path","url":"packages/Webkul/DAM","options":{"symlink":true}}' --json
          composer require unopim/dam:"*@dev" --no-interaction --no-progress --prefer-dist

      - name: Run Rector (dry-run)
        continue-on-error: true
        working-directory: unopim
        run: vendor/bin/rector process packages/Webkul/DAM/src --dry-run --no-progress-bar
